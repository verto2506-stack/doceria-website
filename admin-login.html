<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Doceria Social</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #d4707f;
            --accent-pink: #e8999f;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-light: #f9f7f4;
            --border-color: #e8e8e8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-pink) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-pink) 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(212, 112, 127, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 15px;
            top: 45px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--primary-color);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 8px;
        }

        .remember-forgot input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .remember-forgot a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            background-color: var(--accent-pink);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 112, 127, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            border-left: 4px solid #dc3545;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-footer {
            padding: 0 30px 30px;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .demo-info {
            background-color: var(--bg-light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-color);
        }

        .demo-info h4 {
            color: var(--text-dark);
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .demo-info p {
            font-size: 12px;
            color: var(--text-light);
            margin: 5px 0;
        }

        .demo-info code {
            background-color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                border-radius: 12px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-content {
                padding: 30px 20px;
            }

            .login-footer {
                padding: 0 20px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>👨‍🍳 Admin</h1>
            <p>Painel da Doceria Social</p>
        </div>

        <div class="login-content">
            <div class="error-message" id="error-message"></div>

            <div class="demo-info">
                <h4>🔑 Dados de Demonstração:</h4>
                <p>Email: <code>admin@doceria.com</code></p>
                <p>Senha: <code>senha123</code></p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email do Fabricante</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@doceria.com" 
                        required
                        autofocus
                    >
                </div>

                <div class="form-group password-toggle">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Digite sua senha" 
                        required
                    >
                    <button type="button" class="toggle-btn" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" id="remember" name="remember">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="javascript:alert('Entre em contato com o suporte: contato@doceriasocial.com.br')">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    ENTRAR
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>© 2024 Doceria Social. Todos os direitos reservados.</p>
            <div class="back-link">
                <a href="index.html" onclick="event.preventDefault(); window.location.href='index.html';">
                    ← Voltar ao Site
                </a>
            </div>
        </div>
    </div>

    <script>
        // Credenciais padrão do admin
        const ADMIN_CREDENTIALS = {
            email: 'admin@doceria.com',
            password: 'senha123'
        };

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-btn i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.classList.remove('fa-eye');
                toggleBtn.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleBtn.classList.remove('fa-eye-slash');
                toggleBtn.classList.add('fa-eye');
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 5000);
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('login-btn');

            // Validação
            if (!email || !password) {
                showError('Por favor, preencha todos os campos.');
                return;
            }

            if (email !== ADMIN_CREDENTIALS.email || password !== ADMIN_CREDENTIALS.password) {
                showError('Email ou senha incorretos.');
                return;
            }

            // Simulando carregamento
            loginBtn.classList.add('loading');
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ENTRANDO...';

            // Simular requisição ao servidor
            setTimeout(() => {
                // Salvar sessão no localStorage
                const adminSession = {
                    email: email,
                    loginTime: new Date().toISOString(),
                    isLoggedIn: true
                };

                localStorage.setItem('adminSession', JSON.stringify(adminSession));

                if (remember) {
                    localStorage.setItem('adminEmail', email);
                }

                // Redirecionar para admin
                window.location.href = 'admin.html';
            }, 800);
        }

        // Auto-preenchimento se "lembrar-me" estava ativo
        window.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('adminEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('remember').checked = true;
            }

            // Verificar se já está logado
            const adminSession = JSON.parse(localStorage.getItem('adminSession'));
            if (adminSession && adminSession.isLoggedIn) {
                window.location.href = 'admin.html';
            }
        });

        // Enter para submeter
        document.getElementById('login-form').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
